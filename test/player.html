<!doctype html>
<!-- Local Scratch player: real scratch-vm + scratch-render. Usage: /test/player.html?project=/path/to/game.sb3 -->
<html>
<head>
  <meta charset="utf-8">
  <title>TextToScratch player</title>
  <style>
    body { margin: 0; background: #e5f0ff; font-family: Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
    .bar { display: flex; gap: 8px; }
    button { border: 0; border-radius: 6px; padding: 6px 14px; background: #855cd6; color: #fff; font-weight: bold; cursor: pointer; }
    canvas { width: 480px; height: 360px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <div class="bar"><button id="flag">▶ Green flag</button><button id="stop">■ Stop</button></div>
  <canvas id="stage" width="480" height="360"></canvas>
  <script src="/node_modules/scratch-vm/dist/web/scratch-vm.js"></script>
  <script src="/node_modules/scratch-render/dist/web/scratch-render.js"></script>
  <script src="/node_modules/scratch-storage/dist/web/scratch-storage.js"></script>
  <script src="/test/player.js"></script>
</body>
</html>
