<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><defs></defs><rect width="480" height="360" fill="#05070A" opacity=".55"/><text x="240" y="70" font-family="Marker" font-weight="bold" font-size="56" text-anchor="middle" fill="#9CC832" stroke="#0B0D08" stroke-width="8" paint-order="stroke">DEAD ZONE</text><rect x="120" y="140" width="240" height="44" rx="10" fill="#1E2414" stroke="#B8D850" stroke-width="3"/><text x="240" y="170" font-family="Sans Serif" font-weight="bold" font-size="20" text-anchor="middle" fill="#D8F27A" stroke="#0A0C0E" stroke-width="2.857142857142857" paint-order="stroke" >SINGLE PLAYER</text><rect x="120" y="204" width="240" height="44" rx="10" fill="#1E2414" stroke="#B8D850" stroke-width="3"/><text x="240" y="234" font-family="Sans Serif" font-weight="bold" font-size="20" text-anchor="middle" fill="#D8F27A" stroke="#0A0C0E" stroke-width="2.857142857142857" paint-order="stroke" >ONLINE CO-OP</text><text x="240" y="286" font-family="Sans Serif" font-weight="bold" font-size="12" text-anchor="middle" fill="#C8C2A8" stroke="#0A0C0E" stroke-width="1.7142857142857142" paint-order="stroke" >WASD move  -  Arrows turn  -  Click/Space shoot  -  R reload</text><text x="240" y="304" font-family="Sans Serif" font-weight="bold" font-size="12" text-anchor="middle" fill="#C8C2A8" stroke="#0A0C0E" stroke-width="1.7142857142857142" paint-order="stroke" >Q / 1 / 2 swap weapon  -  E buy, open debris, repair  -  Z X C V B N quick chat</text><text x="240" y="322" font-family="Sans Serif" font-weight="bold" font-size="12" text-anchor="middle" fill="#C8C2A8" stroke="#0A0C0E" stroke-width="1.7142857142857142" paint-order="stroke" >Earn points by hitting and killing zombies. Spend them on wall weapons and doors.</text></svg>