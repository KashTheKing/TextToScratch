<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200"><rect x="4" y="4" width="352" height="192" rx="24" fill="#1B1B2F" opacity=".9" stroke="#FFD23F" stroke-width="5"/><text x="180" y="66" font-family="Marker" font-size="50" text-anchor="middle" fill="#FFD23F" stroke="#1B1B2F" stroke-width="8" stroke-linejoin="round" paint-order="stroke">TURBO LAPS</text><text x="180" y="104" font-family="Sans Serif" font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">Arrow keys: drive and steer</text><text x="180" y="128" font-family="Sans Serif" font-size="15" fill="#C9D3E0" text-anchor="middle">Orange pads boost you, grass slows you</text><text x="180" y="150" font-family="Sans Serif" font-size="15" fill="#C9D3E0" text-anchor="middle">3 laps. Beat the other cars!</text><text x="180" y="180" font-family="Sans Serif" font-weight="bold" font-size="18" fill="#4CE06A" text-anchor="middle">Press SPACE to start</text></svg>